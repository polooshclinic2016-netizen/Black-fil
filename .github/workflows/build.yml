name: Build Revan Flick APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Clean Keyboard Core
        run: |
          git clone --depth 1 https://github.com/Helium314/HeliBoard.git temp_core
          cp -r temp_core/* . || true
          rm -rf temp_core

      - name: Rebrand to Black Flick
        run: |
          find app/src/main/res -name "strings.xml" -exec sed -i 's/HeliBoard/Black Flick/g' {} + 2>/dev/null || true

      - name: Enable BlackBerry Style Flick Gestures
        run: |
          find app/src/main/res/values* -name "donottranslate*.xml" | while read f; do
            sed -i 's/name="default_key_flick">false/name="default_key_flick">true/g' "$f" 2>/dev/null || true
            sed -i 's/name="config_swipe_to_delete">false/name="config_swipe_to_delete">true/g' "$f" 2>/dev/null || true
            sed -i 's/name="default_gesture_space_bar">false/name="default_gesture_space_bar">true/g' "$f" 2>/dev/null || true
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Compile Revan Flick APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Black Flick APK
        uses: actions/upload-artifact@v4
        with:
          name: Black-Flick-APK
          path: app/build/outputs/apk/debug/*.apk
          
